# Nom du workflow, affiché dans l'onglet "Actions" de GitHub.
name: CI

# Déclencheurs : quand le workflow doit-il s'exécuter ?
on:
  push:
    # À chaque push sur la branche main...
    branches: [main]
    # ...et à chaque push d'un tag Git qui commence par "v" (v1.0.0, v2.3.1...).
    tags: ["v*"]
  # À chaque pull request
  pull_request:

jobs:

  # --- Job 1 : tests du backend ---
  tests:
    runs-on: ubuntu-latest

    # Toutes les commandes "run" de ce job s'exécutent dans le dossier backend.
    defaults:
      run:
        working-directory: task-agent-api

    # MongoDB lancé à côté du job, accessible sur localhost:27017.
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests
        run: pytest -v

  # --- Job 2 : vérification du frontend (lint + compilation) ---
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: task-agent-frontend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: task-agent-frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le code (ESLint)
        run: npm run lint -- --max-warnings=0

      - name: Compiler le frontend
        run: npm run build

  # --- Job 3 : construire les images Docker, et les publier pour un push ---
  docker:
    # Nom affiché dans l'onglet Actions : "docker (api)" et "docker (frontend)".
    name: docker (${{ matrix.service }})
    runs-on: ubuntu-latest

    # Attendre que les DEUX vérifications soient réussies
    needs: [tests, frontend]

    # Matrice : GitHub lance ce job UNE FOIS PAR LIGNE de la liste "include",
    # en parallèle. Dans chaque exécution, matrix.service et matrix.contexte
    # prennent les valeurs de la ligne correspondante.
    strategy:
      matrix:
        include:
          - service: api                    # nom de l'image : task-agent-api
            contexte: backend               # dossier contenant le Dockerfile
          - service: frontend               # nom de l'image : task-agent-frontend
            contexte: task-agent-frontend

    # Droits du jeton GITHUB_TOKEN : lire le code, écrire dans le registre.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      # Préparer le nom de l'image et l'identifiant court du commit.
      # github.repository vaut "ton-utilisateur/task-agent" : en y ajoutant
      # "-api" ou "-frontend", on obtient ghcr.io/ton-utilisateur/task-agent-api
      # et ghcr.io/ton-utilisateur/task-agent-frontend.
      - name: Définir le nom de l'image
        run: |
          # Les noms d'images Docker doivent être en minuscules.
          IMAGE=$(echo "ghcr.io/${{ github.repository }}-${{ matrix.service }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          # Les 7 premiers caractères de l'identifiant du commit.
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # Construire l'image avec les tags adaptés à la situation.
      - name: Construire l'image Docker
        run: |
          # Toujours : le tag lisible du commit, par exemple "sha-3f9a2c1"
          TAGS="-t $IMAGE:sha-$SHORT_SHA"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # Push d'un tag Git : on ajoute le numéro de version
            TAGS="$TAGS -t $IMAGE:${{ github.ref_name }}"
          else
            # Push sur main (ou pull request) : on met à jour "latest"
            TAGS="$TAGS -t $IMAGE:latest"
          fi
          # Le dernier argument est le dossier de construction (le "contexte"),
          # différent selon la ligne de la matrice.
          docker build $TAGS ${{ matrix.contexte }}

      # Se connecter au registre, uniquement pour un push
      - name: Se connecter au registre
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Publier l'image avec tous ses tags.
      - name: Publier l'image
        if: github.event_name == 'push'
        run: docker push --all-tags "$IMAGE"
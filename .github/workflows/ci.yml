# Nom du workflow, affiché dans l'onglet "Actions" de GitHub.
name: CI

# Déclencheurs : quand le workflow doit-il s'exécuter ?
on:
  # À chaque push sur la branche main...
  push:
    branches: [main]
  # ...et à chaque pull request (proposition de modification).
  pull_request:

# Les "jobs" sont les grandes tâches du workflow.
jobs:

  # --- Job 1 : lancer les tests ---
  tests:
    runs-on: ubuntu-latest

    # Conteneurs lancés À CÔTÉ du job pendant toute sa durée.
    # On démarre un MongoDB, comme ton conteneur mongo-taches.
    services:
      mongo:
        image: mongo:7.0
        # Port 27017 de la machine relié à celui du conteneur : les tests
        # le trouveront à l'adresse localhost:27017, comme sur notre ordinateur.
        ports:
          - 27017:27017

    # Les étapes du job, exécutées dans l'ordre. Si une étape échoue,
    # les suivantes ne sont pas exécutées et le job est marqué en échec.
    steps:
      # Récupérer le code du dépôt sur la machine virtuelle.
      # "uses" utilise une action toute faite, publiée par GitHub.
      - name: Récupérer le code
        uses: actions/checkout@v5

      # Installer la même version de Python que sur ton ordinateur.
      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # "run" exécute une commande shell, comme dans ton terminal.
      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Lancer les tests. Si un seul échoue, pytest renvoie une erreur
      # et tout le workflow est marqué en échec (croix rouge).
      - name: Lancer les tests
        run: pytest -v

  # --- Job 2 : vérifier que l'image Docker se construit ---
  docker:
    runs-on: ubuntu-latest

    needs: tests

    # Droits accordés au jeton GITHUB_TOKEN pour ce job :
    # lire le code du dépôt, et écrire dans le registre d'images ("packages").
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      # les noms d'images Docker doivent
      # être en minuscules : on convertit avec la commande "tr".
      # On range le résultat dans la variable IMAGE, réutilisable dans
      # les étapes suivantes grâce au fichier spécial $GITHUB_ENV.
      - name: Définir le nom de l'image
        run: echo "IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Construire l'image avec DEUX tags (étiquettes) :
      # - "latest" : toujours la version la plus récente ;
      # - l'identifiant du commit (github.sha) : une version précise et
      #   définitive, qui permet de savoir exactement quel code tourne,
      #   et de revenir à une version antérieure en cas de problème.
      - name: Construire l'image Docker
        run: docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .

      # Se connecter au registre de GitHub avec le jeton temporaire.
      # Le "if" n'exécute cette étape que pour un push (pas une pull request).
      # --password-stdin lit le mot de passe depuis l'entrée standard,
      # pour qu'il n'apparaisse jamais en clair dans la commande.
      - name: Se connecter au registre
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Envoyer l'image dans le registre, avec tous ses tags.
      - name: Publier l'image
        if: github.event_name == 'push'
        run: docker push --all-tags "$IMAGE"